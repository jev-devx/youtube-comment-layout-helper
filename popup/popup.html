<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="app">
      <!-- header -->
      <header class="header">
        <div class="title" data-i18n="title">YCLH</div>
        <div class="subtitle" data-i18n="subtitle">
          YouTube Comment Layout Helper
        </div>
      </header>

      <!-- Info banner -->
      <div id="infoBanner" class="infoBanner" hidden>
        <div class="infoBanner__warn" aria-hidden="true">⚠️</div>
        <div class="infoBanner__text" id="infoBannerText"></div>
      </div>

      <!-- Main -->
      <main class="main">
        <!-- Tabs -->
        <nav class="tabs" role="tablist" aria-label="Popup tabs">
          <button
            id="tabLayout"
            class="tab"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="panelLayout"
            data-i18n="tabLayout"
          >
            メイン
          </button>

          <button
            id="tabMute"
            class="tab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="panelMute"
            tabindex="-1"
            data-i18n="tabMute"
          >
            ミュート
          </button>
        </nav>

        <!-- Panel: Layout -->
        <section
          id="panelLayout"
          class="tabPanel"
          role="tabpanel"
          aria-labelledby="tabLayout"
        >
          <!-- Enable (top) -->
          <section class="card">
            <label class="row toggle-row">
              <div class="row-text">
                <div class="row-title" data-i18n="enabledTitle">
                  YCLHを有効化する
                </div>
                <div class="row-desc" data-i18n="enabledDesc">
                  コメント欄レイアウトを拡張します
                </div>
              </div>

              <span class="toggle">
                <input id="enabled" type="checkbox" />
                <span class="track" aria-hidden="true"></span>
              </span>
            </label>
          </section>

          <!-- Options -->
          <section class="card">
            <div class="section-head">
              <div class="section-title" data-i18n="optionsTitle">OPTIONS</div>
            </div>

            <label class="row toggle-row">
              <div class="row-text">
                <div class="row-title" data-i18n="moveLeftTitle">
                  サイドパネルを左に配置
                </div>
                <div class="row-desc" data-i18n="moveLeftDesc">
                  レイアウトの左右を切り替えます
                </div>
              </div>

              <span class="toggle">
                <input id="moveLeft" type="checkbox" />
                <span class="track" aria-hidden="true"></span>
              </span>
            </label>

            <!-- chatAutoRecommended groupe start -->
            <div class="row">
              <div class="row-text">
                <div class="row-title" data-i18n="chatAutoTitle">
                  チャット・チャットのリプレイの表示方法
                </div>
              </div>
            </div>
            <div class="group">
              <label class="row row-sub radio-row">
                <div class="row-text">
                  <div class="row-title" data-i18n="chatAutoRecommendedTitle">
                    おすすめ
                  </div>
                  <div class="row-desc" data-i18n="chatAutoRecommendedDesc">
                    <ul class="row-desc-list">
                      <li>生配信「チャット」</li>
                      <li>アーカイブ「上位のチャットのリプレイ」</li>
                    </ul>
                    を自動で選択します
                  </div>
                </div>

                <span class="radio">
                  <input
                    id="chatAutoRecommended"
                    name="chatAutoMode"
                    value="recommended"
                    type="radio"
                  />
                  <span class="track" aria-hidden="true"></span>
                </span>
              </label>

              <label class="row row-sub radio-row">
                <div class="row-text">
                  <div class="row-title" data-i18n="chatAutoDefaultTitle">
                    デフォルト
                  </div>
                  <div class="row-desc" data-i18n="chatAutoDefaultDesc">
                    YouTubeの既定の挙動を使用します
                  </div>
                </div>

                <span class="radio">
                  <input
                    id="chatAutoDefault"
                    name="chatAutoMode"
                    value="default"
                    type="radio"
                  />
                  <span class="track" aria-hidden="true"></span>
                </span>
              </label>
            </div>
            <!-- chatAutoRecommended groupe end -->
          </section>
        </section>

        <!-- Panel: Mute -->
        <section
          id="panelMute"
          class="tabPanel"
          role="tabpanel"
          aria-labelledby="tabMute"
          hidden
        >
          <section class="card">
            <div class="section-head">
              <div class="section-title" data-i18n="wordMuteTitle">
                WORD MUTE
              </div>
            </div>

            <!-- Mute banner (YCLH OFF のときだけ表示) -->
            <div id="muteBanner" class="infoBanner infoBanner--mute" hidden>
              <div class="infoBanner__warn" aria-hidden="true">🫠</div>
              <div class="infoBanner__text" id="muteBannerText"></div>
            </div>

            <div class="row">
              <div class="row-text">
                <div class="row-title" data-i18n="muteTitle">ミュート</div>
                <div class="row-desc" data-i18n="muteDesc">
                  指定したワードが含まれるコメント・チャットを見た目のみ置換してミュートします
                </div>
              </div>
            </div>

            <label class="row toggle-row">
              <div class="row-text">
                <div class="row-title" data-i18n="muteApplyChatTitle">
                  チャットにも適用
                </div>
                <div class="row-desc" data-i18n="muteApplyChatDesc">
                  チャット・チャットのリプレイにもミュートを適用します
                </div>
              </div>

              <span class="toggle">
                <input id="muteApplyChat" type="checkbox" />
                <span class="track" aria-hidden="true"></span>
              </span>
            </label>

            <!-- Replace preset -->
            <div class="row">
              <div class="row-text">
                <div class="row-title" data-i18n="replacePresetTitle">
                  置換設定
                </div>
              </div>
            </div>
            <div class="group" id="replacePresetGroup">
              <label class="row row-sub radio-row">
                <div class="row-text">
                  <div class="row-title" data-i18n="replacePresetDefaultTitle">
                    ミュートワードが含まれています
                  </div>
                </div>
                <span class="radio">
                  <input
                    id="replacePresetDefault"
                    name="replacePreset"
                    value="default"
                    type="radio"
                    checked
                  />
                  <span class="track" aria-hidden="true"></span>
                </span>
              </label>
              <label class="row row-sub radio-row">
                <div class="row-text">
                  <div class="row-title" data-i18n="replacePresetNyanTitle">
                    にゃーん
                  </div>
                </div>
                <span class="radio">
                  <input
                    id="replacePresetNyan"
                    name="replacePreset"
                    value="nyan"
                    type="radio"
                  />
                  <span class="track" aria-hidden="true"></span>
                </span>
              </label>
            </div>

            <!-- list -->
            <div class="row">
              <div class="row-text">
                <div class="row-title" data-i18n="muteListTitle">
                  ミュートリスト
                </div>
              </div>
              <div id="muteCount" class="row-meta" aria-label="mute count">
                0/15
              </div>
            </div>
            <div id="muteList" class="muteList"></div>

            <!-- add -->
            <div class="row">
              <button
                id="muteAdd"
                class="btn btn--ghost btn--add"
                type="button"
                data-i18n="muteAddButton"
              >
                ＋ 追加
              </button>
            </div>
          </section>
        </section>
      </main>

      <!-- Footer -->
      <footer class="footer">
        <div class="footer-card">
          <button id="reset" class="btn btn--ghost" type="button">
            <span data-i18n="resetButton">設定をリセット</span>
            <div class="footer-desc" data-i18n="resetDesc">
              YCLHの設定をすべて初期状態に戻します
            </div>
          </button>

          <div class="support">
            <div class="support-head">
              <div class="support-title" data-i18n="supportTitle">
                コーヒーをおごる
              </div>
              <div class="support-desc" data-i18n="supportDesc">
                開発の継続の励みになります
              </div>
            </div>

            <div class="support-actions">
              <a
                class="chip chip--accent"
                href="https://buymeacoffee.com/jev.devx"
                target="_blank"
                rel="noopener noreferrer"
                data-i18n="buyMeCoffeeButton"
              >
                Buy Me a Coffee
              </a>

              <!-- ↓一旦リリースした後に様子を見て解放 -->
              <!-- <a
                class="chip"
                href="https://"
                target="_blank"
                rel="noopener noreferrer"
              >
                Strip
              </a> -->
            </div>
          </div>
        </div>
      </footer>
    </div>

    <!-- Overlay (suspended のときだけ出す) -->
    <div id="statusOverlay" class="statusOverlay" hidden>
      <div class="statusOverlay__card" role="status" aria-live="polite">
        <div class="statusOverlay__title" data-i18n="statusOverlayTitle">
          YCLH は一時停止中
        </div>
        <div id="statusText" class="statusOverlay__text"></div>
        <div
          id="statusHint"
          class="statusOverlay__hint"
          hidden
          data-i18n="statusOverlayHint"
        >
          シアターモード解除 / ウィンドウ幅を広げると再開します
        </div>
      </div>
    </div>

    <script type="module" src="../dist/popup.js"></script>
  </body>
</html>
